name: Build RustFurnaces

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare Forge 1.12.2 MDK
        run: |
          wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2860/forge-1.12.2-14.23.5.2860-mdk.zip -O mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src/main
          cp -r src/main mdk/src/main
          cd mdk
          sed -i 's#http://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#https://files.minecraftforge.net/maven#https://maven.minecraftforge.net#g' build.gradle
          sed -i 's#jcenter()#mavenCentral()#g' build.gradle
          sed -i 's#mappings = ".*"#mappings = "snapshot_20171003"#' build.gradle
          sed -i 's#archivesBaseName = ".*"#archivesBaseName = "rustfurnaces"#' build.gradle
          chmod +x gradlew

      - name: Build
        run: |
          cd mdk
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RustFurnaces-jar
          path: mdk/build/libs/*.jar
